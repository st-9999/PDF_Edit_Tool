# デプロイ先・ヘルス確認の定義（Claude Code メタの監視対象）

project: pdf-edit-tool

deploy:
  provider: github-pages
  workflow: .github/workflows/deploy.yml
  branch: main
  # 公開URL。パス部分はリポジトリ名（= NEXT_PUBLIC_BASE_PATH）と一致させる（大文字小文字も区別される）。
  url: https://st-9999.github.io/PDF_Edit_Tool/

health_check:
  url: https://st-9999.github.io/PDF_Edit_Tool/
  expect_status: 200
  expect_text: "PDF ビューア＆エディタ"
  timeout_seconds: 120
  interval_seconds: 10

notes:
  - "完全クライアント処理のため秘密情報・環境変数は不要（.env なし）"
  - "保存系（File System Access API）は Chromium 系のみ。Firefox はダウンロードへフォールバック"
  - "GitHub Pages（GitHub Actions ソース）で公開済み。main への push で deploy.yml が lint・型チェック・単体テスト・本番ビルドの E2E を通したうえで自動デプロイする"
